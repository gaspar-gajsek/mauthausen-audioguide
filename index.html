koreanisch/16_kr.txt", "zh": "ag/ag_chinesisch/16_cn.txt"}}, {"id": "17", "titles": {"en": "Women's Camp", "ja": "女性強制収容所", "ko": "여성 강제수용소", "zh": "女子集中营"}, "files": {"en": "ag/ag_englisch/17_en.txt", "ja": "ag/ag_japanisch/17_jp.txt", "ko": "ag/ag_koreanisch/17_kr.txt", "zh": "ag/ag_chinesisch/17_cn.txt"}}, {"id": "18", "titles": {"en": "Barrack 20: 'Death Block'", "ja": "第20ブロック――「死のブロック」", "ko": "제20막사: “죽음의 막사”", "zh": "二十号营房：“死亡营房”"}, "files": {"en": "ag/ag_englisch/18_en.txt", "ja": "ag/ag_japanisch/18_jp.txt", "ko": "ag/ag_koreanisch/18_kr.txt", "zh": "ag/ag_chinesisch/18_cn.txt"}}, {"id": "19", "titles": {"en": "Camp II", "ja": "第II収容区", "ko": "제2수용소", "zh": "二号营区"}, "files": {"en": "ag/ag_englisch/19_en.txt", "ja": "ag/ag_japanisch/19_jp.txt", "ko": "ag/ag_koreanisch/19_kr.txt", "zh": "ag/ag_chinesisch/19_cn.txt"}}, {"id": "20", "titles": {"en": "Camp III", "ja": "第III収容区", "ko": "제3수용소", "zh": "三号营区"}, "files": {"en": "ag/ag_englisch/20_en.txt", "ja": "ag/ag_japanisch/20_jp.txt", "ko": "ag/ag_koreanisch/20_kr.txt", "zh": "ag/ag_chinesisch/20_cn.txt"}}, {"id": "21", "titles": {"en": "Infirmary", "ja": "病舎", "ko": "의무구역", "zh": "医务区"}, "files": {"en": "ag/ag_englisch/21_en.txt", "ja": "ag/ag_japanisch/21_jp.txt", "ko": "ag/ag_koreanisch/21_kr.txt", "zh": "ag/ag_chinesisch/21_cn.txt"}}, {"id": "22", "titles": {"en": "Crematoria and Killing Facilities", "ja": "火葬場と殺害施設", "ko": "화장장과 살해시설", "zh": "火葬场与杀人设施"}, "files": {"en": "ag/ag_englisch/22_en.txt", "ja": "ag/ag_japanisch/22_jp.txt", "ko": "ag/ag_koreanisch/22_kr.txt", "zh": "ag/ag_chinesisch/22_cn.txt"}}, {"id": "23", "titles": {"en": "Camp Prison", "ja": "収容所内の拘禁施設", "ko": "수용소 감옥", "zh": "集中营监狱"}, "files": {"en": "ag/ag_englisch/23_en.txt", "ja": "ag/ag_japanisch/23_jp.txt", "ko": "ag/ag_koreanisch/23_kr.txt", "zh": "ag/ag_chinesisch/23_cn.txt"}}, {"id": "24", "titles": {"en": "Liberation", "ja": "解放", "ko": "해방", "zh": "解放"}, "files": {"en": "ag/ag_englisch/24_en.txt", "ja": "ag/ag_japanisch/24_jp.txt", "ko": "ag/ag_koreanisch/24_kr.txt", "zh": "ag/ag_chinesisch/24_cn.txt"}}];
const ui={
sl:{badge:'Poskusna različica',intro:'Izberi jezik in postajo za prikaz besedila.',language:'Jezik',station:'Postaja',section:'Transkript',empty:'Besedilo za to postajo še ni dodano. Zvočni posnetki še niso na voljo.',notice:'Neuradna poskusna stran. Naslovi so delovni prevodi; vsebina še ni strokovno pregledana.'},
de:{badge:'Testversion',intro:'Sprache und Station auswählen, um den Text anzuzeigen.',language:'Sprache',station:'Station',section:'Transkript',empty:'Der Text für diese Station wurde noch nicht hinzugefügt. Audioaufnahmen sind noch nicht verfügbar.',notice:'Inoffizielle Testseite. Die Titel sind Arbeitsübersetzungen; die Inhalte wurden noch nicht fachlich geprüft.'},
en:{badge:'Test version',intro:'Choose a language and station to view the text.',language:'Language',station:'Station',section:'Transcript',empty:'The text for this station has not been added yet. Audio recordings are not yet available.',notice:'Unofficial test page. Titles are draft translations; content has not yet been reviewed by specialists.'},
ja:{badge:'試作版',intro:'言語と見学地点を選択してください。',language:'言語',station:'見学地点',section:'テキスト',empty:'この地点のテキストはまだ追加されていません。音声もまだ利用できません。',notice:'非公式の試作ページです。タイトルは仮訳であり、内容はまだ専門家による確認を受けていません。'},
ko:{badge:'시험 버전',intro:'언어와 관람 지점을 선택하세요.',language:'언어',station:'관람 지점',section:'텍스트',empty:'이 지점의 텍스트는 아직 추가되지 않았습니다. 음성 녹음도 아직 제공되지 않습니다.',notice:'비공식 시험 페이지입니다. 제목은 임시 번역이며, 내용은 아직 전문가의 검토를 받지 않았습니다.'},
zh:{badge:'测试版',intro:'请选择语言和参观站点。',language:'语言',station:'参观站点',section:'文字稿',empty:'此站点的文字稿尚未添加。音频暂未提供。',notice:'非官方测试页面。标题为暂译，内容尚未经专业审核。'}
};

const prompts={en:'Choose a station…',de:'Station auswählen…',sl:'Izberi postajo…',ja:'見学地点を選択…',ko:'관람 지점을 선택하세요…',zh:'请选择参观站点…'};
const language=document.getElementById('language'),station=document.getElementById('station');
let chosen='';
let pending;
const cache=new Map();
function render(){
 stopReading();textReady=false;
 const lang=language.value,t=ui[lang];if(!t)return;
 document.documentElement.lang=lang;updateAudio();document.body.classList.add('ready');
 document.getElementById('languageLabel').textContent=t.language;
 document.getElementById('stationBox').hidden=false;
 document.getElementById('stationLabel').textContent=t.station;
 const prompt=document.createElement('option');prompt.value='';prompt.textContent=prompts[lang];prompt.disabled=true;
 station.replaceChildren(prompt,...stations.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' · '+s.titles[lang];return o}));station.value=chosen;
 document.getElementById('notice').hidden=false;document.getElementById('notice').textContent=t.notice;
 const selected=stations.find(s=>s.id===chosen);document.getElementById('transcript').hidden=!selected;
 if(selected){document.getElementById('sectionLabel').textContent=t.section;document.getElementById('heading').textContent=selected.id+' · '+selected.titles[lang];document.getElementById('status').textContent=t.loading;loadText(selected,lang);}
}
const loading={en:'Loading text…',ja:'テキストを読み込み中…',ko:'텍스트를 불러오는 중…',zh:'正在加载文字稿…'};
const errors={en:'The text could not be loaded. Check your connection, then choose the station again. For this download, upload index.html and the ag folder to your website first.',ja:'テキストを読み込めませんでした。接続を確認し、見学地点をもう一度選択してください。',ko:'텍스트를 불러올 수 없습니다. 인터넷 연결을 확인한 후 관람 지점을 다시 선택하세요.',zh:'无法加载文字稿。请检查网络连接，然后重新选择参观站点。'};
for(const lang of ['en','ja','ko','zh'])ui[lang].loading=loading[lang];
async function loadText(selected,lang){
 if(pending)pending.abort();
 const controller=new AbortController();pending=controller;
 const path=selected.files[lang];
 try{
  let text=cache.get(path);
  if(text===undefined){const response=await fetch(path,{signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);text=(await response.text()).replace(/^\uFEFF/,'');if(/^\s*<!doctype html/i.test(text))throw new Error('Unexpected HTML');cache.set(path,text);}
  if(controller.signal.aborted||language.value!==lang||chosen!==selected.id)return;
  const lines=text.split(/\r?\n/);const first=lines.findIndex(line=>line.trim());
  document.getElementById('status').textContent=lines.slice(first+1).join('\n').trim();textReady=true;updateAudio();
 }catch(error){if(error.name!=='AbortError'&&language.value===lang&&chosen===selected.id)document.getElementById('status').textContent=errors[lang];}
}
const audioUI={
en:{listen:'Listen',pause:'Pause',resume:'Resume',stop:'Stop',ready:'Computer-generated voice. Pronunciation may be imperfect.',none:'No voice for this language is available on this device.',unsupported:'This browser does not support text-to-speech.',reading:'Reading…',paused:'Paused.',error:'Reading failed. Try again or use another browser.'},
ja:{listen:'読み上げ',pause:'一時停止',resume:'再開',stop:'停止',ready:'合成音声です。発音が正確でない場合があります。',none:'この端末では、この言語の音声を利用できません。',unsupported:'このブラウザーは読み上げに対応していません。',reading:'読み上げ中…',paused:'一時停止中。',error:'読み上げに失敗しました。再試行するか、別のブラウザーをご利用ください。'},
ko:{listen:'듣기',pause:'일시 정지',resume:'계속 듣기',stop:'정지',ready:'컴퓨터 합성 음성입니다. 발음이 정확하지 않을 수 있습니다.',none:'이 기기에서 해당 언어의 음성을 사용할 수 없습니다.',unsupported:'이 브라우저는 텍스트 읽기를 지원하지 않습니다.',reading:'읽는 중…',paused:'일시 정지됨.',error:'읽기에 실패했습니다. 다시 시도하거나 다른 브라우저를 사용하세요.'},
zh:{listen:'朗读',pause:'暂停',resume:'继续',stop:'停止',ready:'电脑合成语音，发音可能不完全准确。',none:'此设备没有可用的该语言语音。',unsupported:'此浏览器不支持文字朗读。',reading:'正在朗读…',paused:'已暂停。',error:'朗读失败。请重试或使用其他浏览器。'}};
const synthesis=('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;
let textReady=false,reading=false,paused=false,run=0,utterance=null,parts=[],partIndex=0;
function voiceForLanguage(){if(!synthesis)return null;const lang=language.value;const voices=synthesis.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').split('-')[0]===lang);return voices.find(v=>v.lang.toLowerCase()==={en:'en-gb',ja:'ja-jp',ko:'ko-kr',zh:'zh-cn'}[lang])||voices[0]||null;}
function updateAudio(message){const t=audioUI[language.value];if(!t)return;const voice=voiceForLanguage();document.getElementById('listen').textContent=t.listen;document.getElementById('pause').textContent=paused?t.resume:t.pause;document.getElementById('stop').textContent=t.stop;document.getElementById('listen').disabled=!textReady||!voice||reading;document.getElementById('pause').disabled=!reading;document.getElementById('stop').disabled=!reading;document.getElementById('audioStatus').textContent=message||(!synthesis?t.unsupported:!voice?t.none:paused?t.paused:reading?t.reading:t.ready);}
function stopReading(){run++;reading=false;paused=false;utterance=null;if(synthesis)synthesis.cancel();updateAudio();}
function speakPart(token,voice){if(token!==run||!reading)return;if(partIndex>=parts.length){reading=false;utterance=null;updateAudio();return;}utterance=new SpeechSynthesisUtterance(parts[partIndex]);utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=1;utterance.onend=()=>{if(token!==run)return;partIndex++;if(!paused)speakPart(token,voice);};utterance.onerror=e=>{if(token!==run)return;if(e.error==='interrupted'||e.error==='canceled')return;reading=false;paused=false;updateAudio(audioUI[language.value].error);};synthesis.speak(utterance);}
document.getElementById('listen').addEventListener('click',()=>{const voice=voiceForLanguage();if(!textReady||!voice)return;stopReading();const text=document.getElementById('heading').textContent+'.\n'+document.getElementById('status').textContent;parts=text.match(/[^。！？.!?\n]+[。！？.!?]?|[。！？.!?]/gu)||[text];parts=parts.flatMap(part=>{const chars=Array.from(part);const out=[];while(chars.length)out.push(chars.splice(0,180).join(''));return out;}).filter(part=>part.trim());partIndex=0;reading=true;updateAudio();speakPart(run,voice);});
document.getElementById('pause').addEventListener('click',()=>{if(!reading)return;paused=!paused;if(paused)synthesis.pause();else{if(synthesis.paused)synthesis.resume();else speakPart(run,voiceForLanguage());}updateAudio();});
document.getElementById('stop').addEventListener('click',stopReading);
if(synthesis)synthesis.addEventListener('voiceschanged',()=>updateAudio());
window.addEventListener('pagehide',stopReading);
language.addEventListener('change' ,()=>{render();if(!chosen)station.focus()});
station.addEventListener('change',()=>{chosen=station.value;render()});
</script></body></html>
